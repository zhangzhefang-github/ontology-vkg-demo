name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ontology-vkg-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start MySQL and Ontop
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Verify Phase 1 SQL and SPARQL
        run: |
          bash scripts/test-sql.sh
          bash scripts/test-sparql.sh

      - name: Verify Phase 2 reasoning experiments
        run: bash scripts/test-phase2.sh

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=300 mysql ontop

      - name: Clean up
        if: always()
        run: docker compose --profile phase2 down --volumes --remove-orphans
